<style>
/* Layout: komponistregister til venstre, spor til høyre, fast spiller nederst */
:root {
  --bg: #eceef2;
  --panel: #f8f9fb;
  --ink: #151a24;
  --muted: #5b6375;
  --line: #d3d7e0;
  --accent: #2f45c9;
  --accent-ink: #ffffff;
  --ok: #1d7a4f;
  --none: #a24a3a;
  --display: "Bodoni Moda", "Didot", Georgia, serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141b; --panel: #181c25; --ink: #e7e9ef; --muted: #98a0b3;
    --line: #2a303d; --accent: #8a9bff; --accent-ink: #0d1020; --ok: #5fcf97; --none: #ef8f7c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141b; --panel: #181c25; --ink: #e7e9ef; --muted: #98a0b3;
  --line: #2a303d; --accent: #8a9bff; --accent-ink: #0d1020; --ok: #5fcf97; --none: #ef8f7c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--body);
  padding: 28px max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 24px; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
h1 { font: 500 clamp(30px, 5vw, 46px)/1.05 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 em { font-style: italic; color: var(--accent); }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 60ch; }
.random { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; }
.grid { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 24px; align-items: start; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
.index { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.ghead { padding: 14px 14px 4px; font: italic 500 17px/1.2 var(--display); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; border-top: 1px solid var(--line); }
.ghead:first-child { border-top: 0; }
.ghead small { font: 11px var(--mono); color: var(--muted); font-style: normal; }
.tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1 1 auto; }
.tabs button { background: none; border: 0; padding: 12px 10px; font-weight: 600; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.filter { padding: 10px; border-bottom: 1px solid var(--line); }
.filter input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
.era { padding: 10px 14px 4px; font-size: 12px; color: var(--muted); }
ul.list { list-style: none; margin: 0; padding: 4px 0 8px; max-height: 64vh; overflow-y: auto; }
@media (max-width: 760px) { ul.list { max-height: 40vh; } }
ul.list button { width: 100%; text-align: left; background: none; border: 0; padding: 7px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; }
ul.list button:hover { background: var(--bg); }
ul.list button[aria-current="true"] { background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
.cname { font-weight: 500; }
.cmeta { grid-column: 1; font-size: 12px; color: var(--muted); }
.cstat { grid-row: 1 / span 2; grid-column: 2; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.cstat.ok { color: var(--ok); }
.cstat.none { color: var(--none); }
.stage { min-width: 0; display: grid; gap: 16px; }
.stage h2 { font: 500 clamp(26px, 4vw, 38px)/1.1 var(--display); margin: 0; text-wrap: balance; }
.stage .sub { color: var(--muted); margin: 4px 0 0; }
.note { font-size: 13px; color: var(--muted); }
.tracks { display: grid; gap: 2px; }
.track { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 8px; border-radius: 8px; background: transparent; border: 0; text-align: left; width: 100%; }
.track:hover { background: var(--panel); }
.track.playing { background: var(--panel); box-shadow: inset 0 0 0 1px var(--accent); }
.track img { width: 52px; height: 52px; border-radius: 4px; object-fit: cover; background: var(--line); }
.tinfo { min-width: 0; }
.ttitle { font-weight: 500; overflow-wrap: anywhere; }
.tsub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.tlen { font: 12px var(--mono); color: var(--muted); }
.empty { padding: 32px 20px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); }
.player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--panel); border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.pinner { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
.ctrls { display: flex; gap: 6px; }
.ctrls button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; }
.ctrls button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ctrls svg { width: 16px; height: 16px; fill: currentColor; }
.now { min-width: 0; }
.now .ttitle, .now .tsub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.player a { color: var(--accent); font-size: 13px; white-space: nowrap; }
@media (max-width: 520px) { .player a { display: none; } .pinner { grid-template-columns: auto 1fr; } }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .25s linear; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Neoklassisk <em>lyttestasjon</em></h1>
      <p class="lede">Velg en komponist, så henter siden 30 sekunders klipp fra iTunes og spiller dem etter hverandre.</p>
    </div>
    <button class="random" id="random">Tilfeldig komponist</button>
  </header>

  <div class="grid">
    <nav class="index" aria-label="Komponister">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-klassisk" aria-selected="true">1900-tallet</button>
        <button role="tab" id="tab-moderne" aria-selected="false">Moderne</button>
        <button role="tab" id="tab-film" aria-selected="false">Film</button>
        <button role="tab" id="tab-epoker" aria-selected="false">Epoker</button>
        <button role="tab" id="tab-musikaler" aria-selected="false">Musikaler</button>
        <button role="tab" id="tab-world" aria-selected="false">World</button>
        <button role="tab" id="tab-elektronisk" aria-selected="false">Elektronisk</button>
      </div>
      <div class="filter"><input id="filter" type="search" placeholder="Søk i listen" aria-label="Søk i listen"></div>
      <div class="era" id="era"></div>
      <ul class="list" id="list"></ul>
    </nav>

    <main class="stage" id="stage">
      <div class="empty">Velg en komponist i listen. Klippene starter med én gang, og neste spor følger automatisk.</div>
    </main>
  </div>
</div>

<div class="player" id="player">
  <div class="pinner">
    <div class="ctrls">
      <button id="prev" aria-label="Forrige"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
      <button id="play" class="main" aria-label="Spill"><svg viewBox="0 0 16 16" id="playicon"><path d="M4 2l10 6-10 6z"/></svg></button>
      <button id="next" aria-label="Neste"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
    </div>
    <div class="now">
      <div class="ttitle" id="nowTitle">Ingenting spilles</div>
      <div class="tsub" id="nowSub">Velg en komponist</div>
      <div class="bar"><i id="progress"></i></div>
    </div>
    <a id="nowLink" href="#" target="_blank" rel="noopener" hidden>Åpne i Apple Music</a>
  </div>
</div>

<audio id="audio" preload="none"></audio>

const $ = id => document.getElementById(id);
const audio = $("audio");
const cache = new Map();      // key -> tracks[]
let activeList = "klassisk";
let current = null;           // {list, idx}
let queue = [], qi = -1;

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9 ]/g, "").trim();
const keyOf = (list, idx) => list + ":" + idx;

// iTunes svarer med CORS-header; JSONP er reserve hvis fetch blokkeres (f.eks. fra file://)
let jsonpN = 0;
function itunes(path) {
  const url = "https://itunes.apple.com/" + path + (path.includes("?") ? "&" : "?") + "country=NO";
  return fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .catch(() => new Promise((resolve, reject) => {
      const cb = "__it" + (jsonpN++);
      const s = document.createElement("script");
      const t = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 10000);
      function cleanup() { clearTimeout(t); delete window[cb]; s.remove(); }
      window[cb] = data => { cleanup(); resolve(data); };
      s.onerror = () => { cleanup(); reject(new Error("jsonp")); };
      s.src = url + "&callback=" + cb;
      document.head.appendChild(s);
    }));
}

function clean(results, limit = 15) {
  const seen = new Set(), out = [];
  for (const r of results || []) {
    if (r.wrapperType !== "track" || !r.previewUrl) continue;
    const k = norm(r.trackName || "");
    if (seen.has(k)) continue;
    seen.add(k); out.push(r);
    if (out.length >= limit) break;
  }
  return out;
}

async function byArtist(q, genre = /Soundtrack|Classical/) {
  // "id:123" peker direkte på en Apple-artist når navnet er tvetydig
  let artistId = q.startsWith("id:") ? q.slice(3) : null;
  if (!artistId) {
    const s = await itunes("search?term=" + encodeURIComponent(q) + "&entity=musicArtist&limit=50");
    const hits = (s.results || []).filter(a => norm(a.artistName) === norm(q));
    const hit = hits.find(a => genre.test(a.primaryGenreName || "")) || hits[0];
    if (!hit) return [];
    artistId = hit.artistId;
  }
  const l = await itunes("lookup?id=" + artistId + "&entity=song&limit=50");
  return clean(l.results);
}
async function byComposer(q) {
  const s = await itunes("search?term=" + encodeURIComponent(q) + "&media=music&entity=song&attribute=composerTerm&limit=50");
  return clean(s.results);
}
async function byLooseTerm(q) {
  const surname = norm(q).split(" ").pop();
  const s = await itunes("search?term=" + encodeURIComponent(q) + "&media=music&entity=song&limit=50");
  return clean((s.results || []).filter(r => norm([r.artistName, r.collectionName, r.trackName].join(" ")).includes(surname)));
}

async function tracksFor(list, idx) {
  const k = keyOf(list, idx);
  if (cache.has(k)) return cache.get(k);
  const [name, , , alt] = LISTS[list].items[idx];
  const q = alt || name;
  const order = q.startsWith("id:") ? [byArtist]
    : LISTS[list].mode === "artist" ? [byArtist, byComposer, byLooseTerm] : [byComposer, byLooseTerm];
  let tracks = [];
  for (const fn of order) {
    try { tracks = await fn(q, LISTS[list].genre); } catch (e) { tracks = []; }
    if (tracks.length) break;
  }
  cache.set(k, tracks);
  return tracks;
}

function renderList() {
  const L = LISTS[activeList];
  $("era").textContent = L.era;
  const f = norm($("filter").value);
  const ul = $("list");
  ul.innerHTML = "";
  L.items.forEach(([name, land, note], idx) => {
    if (name.startsWith("#")) {
      if (f) return;
      const h = document.createElement("li");
      h.className = "ghead";
      h.innerHTML = "<span></span><small></small>";
      h.querySelector("span").textContent = name.slice(1);
      h.querySelector("small").textContent = land;
      ul.appendChild(h);
      return;
    }
    if (f && !norm(name + " " + land + " " + note).includes(f)) return;
    const li = document.createElement("li");
    const b = document.createElement("button");
    const k = keyOf(activeList, idx);
    if (current && keyOf(current.list, current.idx) === k) b.setAttribute("aria-current", "true");
    const stat = cache.has(k) ? (cache.get(k).length ? cache.get(k).length + " klipp" : "ingen") : "";
    const cls = cache.has(k) ? (cache.get(k).length ? "ok" : "none") : "";
    b.innerHTML = `<span class="cname"></span><span class="cstat ${cls}">${stat}</span><span class="cmeta"></span>`;
    b.querySelector(".cname").textContent = name;
    b.querySelector(".cmeta").textContent = land + (note ? " · " + note : "");
    b.addEventListener("click", () => openComposer(activeList, idx, true));
    li.appendChild(b); ul.appendChild(li);
  });
}

function fmtYear(d) { return d ? new Date(d).getFullYear() : ""; }

async function openComposer(list, idx, autoplay) {
  current = { list, idx };
  renderList();
  const [name, land, note] = LISTS[list].items[idx];
  const stage = $("stage");
  stage.innerHTML = `<div><h2></h2><p class="sub"></p></div><p class="note">Henter klipp fra iTunes …</p>`;
  stage.querySelector("h2").textContent = name;
  stage.querySelector(".sub").textContent = land + (note ? " · " + note : "");
  const tracks = await tracksFor(list, idx);
  if (!current || current.list !== list || current.idx !== idx) return;
  renderList();
  stage.querySelector(".note").remove();
  if (!tracks.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "Fant ingen klipp for denne komponisten i iTunes. Prøv en annen, eller søk direkte i Apple Music eller Spotify.";
    stage.appendChild(e);
    return;
  }
  const p = document.createElement("p");
  p.className = "note";
  p.textContent = LISTS[list].mode === "composer"
    ? `${tracks.length} spor der ${name} står som komponist. Utøverne står under hvert spor.`
    : `${tracks.length} spor med ${name}.`;
  stage.appendChild(p);
  const wrap = document.createElement("div");
  wrap.className = "tracks";
  tracks.forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "track";
    b.dataset.i = i;
    b.innerHTML = `<img alt="" loading="lazy"><div class="tinfo"><div class="ttitle"></div><div class="tsub"></div></div><span class="tlen">0:30</span>`;
    b.querySelector("img").src = t.artworkUrl100 || t.artworkUrl60 || "";
    b.querySelector(".ttitle").textContent = t.trackName;
    b.querySelector(".tsub").textContent = [t.artistName, t.collectionName, fmtYear(t.releaseDate)].filter(Boolean).join(" · ");
    b.addEventListener("click", () => { queue = tracks; playAt(i); });
    wrap.appendChild(b);
  });
  stage.appendChild(wrap);
  if (autoplay) { queue = tracks; playAt(0); }
}

function markPlaying() {
  document.querySelectorAll(".track").forEach(el => el.classList.toggle("playing", queue === (current && cache.get(keyOf(current.list, current.idx))) && +el.dataset.i === qi));
}

function playAt(i) {
  if (!queue.length) return;
  qi = (i + queue.length) % queue.length;
  const t = queue[qi];
  audio.src = t.previewUrl;
  audio.play().catch(() => {});
  $("nowTitle").textContent = t.trackName;
  $("nowSub").textContent = t.artistName;
  const link = $("nowLink");
  link.href = t.trackViewUrl || t.collectionViewUrl || "#";
  link.hidden = !link.href;
  markPlaying();
}

function setIcon(playing) {
  $("playicon").innerHTML = playing ? '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>' : '<path d="M4 2l10 6-10 6z"/>';
  $("play").setAttribute("aria-label", playing ? "Pause" : "Spill");
}

audio.addEventListener("play", () => setIcon(true));
audio.addEventListener("pause", () => setIcon(false));
audio.addEventListener("ended", () => playAt(qi + 1));
audio.addEventListener("timeupdate", () => {
  $("progress").style.width = audio.duration ? (audio.currentTime / audio.duration * 100) + "%" : "0";
});
$("play").addEventListener("click", () => {
  if (!audio.src) { $("random").click(); return; }
  audio.paused ? audio.play().catch(() => {}) : audio.pause();
});
$("next").addEventListener("click", () => playAt(qi + 1));
$("prev").addEventListener("click", () => playAt(audio.currentTime > 3 ? qi : qi - 1));

$("random").addEventListener("click", () => {
  const idxs = LISTS[activeList].items.map((it, i) => it[0].startsWith("#") ? -1 : i).filter(i => i >= 0);
  openComposer(activeList, idxs[Math.floor(Math.random() * idxs.length)], true);
});

function setTab(name) {
  activeList = name;
  for (const k of Object.keys(LISTS)) $("tab-" + k).setAttribute("aria-selected", k === name);
  renderList();
}
for (const k of Object.keys(LISTS)) $("tab-" + k).addEventListener("click", () => setTab(k));
$("filter").addEventListener("input", renderList);

renderList();
