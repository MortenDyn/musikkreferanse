<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyttestasjon</title>
<meta name="description" content="Komponister og artister fra middelalder til elektronika, med lydklipp, sentrale verk og videoer.">
<meta name="theme-color" content="#2f45c9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lyttestasjon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Lytte<em>stasjon</em></h1>
      <p class="lede">Velg en epoke eller sjanger og en komponist. Siden spiller 30 sekunders klipp fra iTunes etter hverandre.</p>
    </div>
    <div class="actions">
      <button class="btn primary" id="sequence" aria-pressed="false">Spill første verk fra alle</button>
      <button class="btn" id="random">Tilfeldig komponist</button>
      <button class="btn" id="scan">Skann program</button>
    </div>
  </header>

  <div class="grid">
    <nav class="index" aria-label="Komponister">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="filter">
        <input id="filter" type="search" placeholder="Søk etter komponist i alle faner" aria-label="Søk etter komponist i alle faner">
        <select id="type" aria-label="Verktype"><option value="">Alle verktyper</option></select>
      </div>
      <div class="era" id="era"></div>
      <ul class="list" id="list"></ul>
    </nav>

    <main class="stage" id="stage">
      <div class="empty">Velg en komponist i listen. Klippene starter med én gang, og neste spor følger automatisk.</div>
    </main>
  </div>
  <footer id="updated"></footer>
</div>

<div class="player" id="player">
  <div class="pinner">
    <div class="ctrls">
      <button id="prev" aria-label="Forrige"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
      <button id="play" class="main" aria-label="Spill"><svg viewBox="0 0 16 16" id="playicon"><path d="M4 2l10 6-10 6z"/></svg></button>
      <button id="next" aria-label="Neste"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
    </div>
    <div class="now">
      <div class="ttitle" id="nowTitle">Ingenting spilles</div>
      <div class="tsub" id="nowSub">Velg en komponist</div>
      <div class="bar"><i id="progress"></i></div>
    </div>
    <a id="nowLink" href="#" target="_blank" rel="noopener" hidden>Åpne i Apple Music</a>
  </div>
</div>

<audio id="audio" preload="none"></audio>
<script src="app.js"></script>
<script src="skann.js"></script>
</body>
</html>
